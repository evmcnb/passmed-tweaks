<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tweaks for Passmedicine</title>
<style>
  :root { --bg: #fff; --fg: #1d2330; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17191f; --fg: #e6e8ee; --muted: #9aa0ad; --line: #2c3039; --accent: #60a5fa; } }
  body { margin: 0; width: 320px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
  section { padding: 8px 14px 10px; border-bottom: 1px solid var(--line); }
  h2 { margin: 4px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; cursor: pointer; }
  label small { display: block; color: var(--muted); font-size: 11px; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  select, input[type=number] { font: inherit; padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  input[type=number] { width: 60px; }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  input[type=color] { width: 32px; height: 22px; border: 1px solid var(--line); border-radius: 4px; padding: 0; background: none; }
  #custom { display: none; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  #custom.on { display: grid; }
  footer { padding: 8px 14px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<header>Tweaks for Passmedicine <a href="stats.html" target="_blank" style="float:right;font-size:12px;font-weight:600;color:var(--accent)">My stats →</a></header>

<section>
  <h2>Appearance</h2>
  <label>Theme <select name="theme" id="theme"></select></label>
  <div id="custom">
    <label>Background <input type="color" name="customBg"></label>
    <label>Cards <input type="color" name="customSurface"></label>
    <label>Text <input type="color" name="customText"></label>
    <label>Accent <input type="color" name="customAccent"></label>
  </div>
  <label>Font
    <select name="font">
      <option value="site">Site default</option>
      <option value="system">System</option>
      <option value="readable">Verdana (readable)</option>
      <option value="serif">Serif</option>
      <option value="mono">Monospace</option>
    </select>
  </label>
  <label>Question text size <span><input type="range" name="fontScale" min="85" max="150" step="5"> <output id="scaleOut"></output></span></label>
  <label><span>UI polish<small>Rounded options, spacing, line height</small></span><input type="checkbox" name="polish"></label>
  <label><span>Wide layout</span><input type="checkbox" name="wide"></label>
  <label><span>Focus mode<small>Hide side columns on question pages</small></span><input type="checkbox" name="focus"></label>
  <label><span>Better results tables<small>Reference column and cleaner styling</small></span><input type="checkbox" name="labTables"></label>
  <label><span>Flag abnormal results<small>Colour + ↑/↓ out-of-range values (makes it easier)</small></span><input type="checkbox" name="labFlags"></label>
  <label><span>Hide AI buttons</span><input type="checkbox" name="hideAi"></label>
  <label><span>Hide "get the app" banner</span><input type="checkbox" name="hideBanner"></label>
</section>

<section>
  <h2>Scores</h2>
  <label><span>Hide my scores<small>Ticks, dashboard, daily %, progress. Hover to peek</small></span><input type="checkbox" name="hideScores"></label>
  <label><span>Hide peer answer %<small>Hover the options to reveal</small></span><input type="checkbox" name="hidePeer"></label>
  <label><span>Question timer</span><input type="checkbox" name="timer"></label>
  <label><span>Pace alert (seconds)<small>Timer turns amber past this, red past double. 0 = off</small></span><input type="number" name="paceSeconds" min="0" max="600" step="5"></label>
  <label><span>Peer % in review list<small>Shows how many get each question right; sort by hardest</small></span><input type="checkbox" name="reviewDifficulty"></label>
  <label><span>Log my answers<small>Kept in this browser; powers My stats and the Anki export</small></span><input type="checkbox" name="logStats"></label>
  <label><span>Today vs peers in the corner</span><input type="checkbox" name="peerCompare"></label>
</section>

<section>
  <h2>Practice modes</h2>
  <label><span>Blind blocks<small>No right/wrong or explanations until you've done a block, then review it</small></span><input type="checkbox" name="blindBlock"></label>
  <label>Questions per block <input type="number" name="blindBlockSize" min="1" max="200" step="1"></label>
  <label><span>Cover test<small>Hide the options until you've thought of (or typed) an answer</small></span><input type="checkbox" name="coverTest"></label>
  <label><span>Type my answer first</span><input type="checkbox" name="coverType"></label>
</section>

<section>
  <h2>Insights</h2>
  <label><span>Insights panel<small>Attempts, difficulty, common wrong answer, your concept history</small></span><input type="checkbox" name="insights"></label>
  <label><span>Show stats before answering<small>Attempts, difficulty and rating only</small></span><input type="checkbox" name="insightsPreAnswer"></label>
  <label><span>Concept explanation</span><input type="checkbox" name="conceptExplanation"></label>
</section>

<section>
  <h2>Comments</h2>
  <label><span>Enhanced comments<small>Threads, sort, search, Ctrl+Enter to post</small></span><input type="checkbox" name="comments"></label>
  <label>Default sort
    <select name="commentSort">
      <option value="top">Top</option><option value="new">Newest</option>
      <option value="old">Oldest</option><option value="replies">Most replies</option>
    </select>
  </label>
  <label>Hide threads scoring below <input type="number" name="minCommentScore" step="1"></label>
  <label><span>Hide reply boxes until "Reply"</span><input type="checkbox" name="hideReplyBoxes"></label>
  <label><span>Collapse replies by default</span><input type="checkbox" name="collapseReplies"></label>
</section>

<footer>Changes apply instantly to open Passmedicine tabs.</footer>
<script src="src/shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
